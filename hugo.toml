baseURL = "https://cun-zai.vip/"
locale = "zh-CN"
defaultContentLanguage = "zh"
title = "CunZai1069 Blogs"
theme = "PaperMod"

buildDrafts = true
buildExpired = true
buildFuture = false

enableRobotsTXT = true
enableEmoji = true
enableGitInfo = true
enableMissingTranslationPlaceholders = true

ShowToc = true

[pagination]
  pagerSize = 10

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
  [markup.goldmark.extensions.passthrough]
    enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block  = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)'], ['$', '$']]

[permalinks]
  posts = "/posts/:year/:month/:slug/"

[taxonomies]
  tag = "tags"
  category = "categories"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  description = "记录技术、阅读与生活"
  author = "CunZai1069"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  ShowToc = true
  TocOpen = false
  comments = false
  mainSections = ["posts"]

  [params.homeInfoParams]
    Title = "CunZai1069"
    Content = "笔记归档。基于 Hugo + PaperMod 构建。"

  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

[[menu.main]]
  identifier = "posts"
  name = "文章"
  url = "/posts/"
  weight = 10

[[menu.main]]
  identifier = "tags"
  name = "标签"
  url = "/tags/"
  weight = 20

[[menu.main]]
  identifier = "search"
  name = "搜索"
  url = "/search/"
  weight = 30

[[menu.main]]
  identifier = "about"
  name = "关于"
  url = "/about/"
  weight = 40

[[menu.footer]]
identifier = "concat"
name = "concat"
weight = 10


[languages]
  [languages.zh]
    languageName = "简中"
    weight = 1
    title = "CunZai1069"
  [language.en]
    languageName = "English"
    weight = 2
    title = "CunZai1069"
